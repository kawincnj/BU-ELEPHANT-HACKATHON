<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ระบบระบุตัวตนช้าง (Elephant Identification)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary: #ff8c00;
      --primary-dark: #e67e00;
      --secondary: #8b0000;
      --accent: #2ecc71;
      --accent-hover: #27ae60;
      --text: #2c3e50;
      --text-light: #7f8c8d;
      --bg: #f8f9fa;
      --card: #ffffff;
      --border: #e1e4e8;
      --shadow: rgba(0, 0, 0, 0.1);
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('elephant.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #764ba2;
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
    }
    
    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      animation: fadeInDown 0.6s ease;
      background: linear-gradient(135deg, rgba(255, 140, 0, 0.6) 0%, rgba(255, 100, 50, 0.6) 100%);
      backdrop-filter: blur(3px);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 140, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
    
    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }
    
    .header .subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }
    
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      animation: fadeIn 0.8s ease;
    }
    
    .upload-section, .results-section {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(3px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px var(--shadow);
    }
    
    .upload-section h2, .results-section h2 {
      font-size: 1.5rem;
      color: var(--text);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .current-time {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 20px;
      text-align: center;
      font-style: italic;
    }
    
    .upload-area {
      border: 3px dashed var(--border);
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(253, 251, 251, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .upload-area:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(46, 204, 113, 0.05);
    }
    
    .upload-icon {
      font-size: 4rem;
      color: var(--primary);
      margin-bottom: 15px;
    }
    
    .upload-text {
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .upload-hint {
      font-size: 0.9rem;
      color: var(--text-light);
    }
    
    #fileInput {
      display: none;
    }
    
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
    }
    
    .preview-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 12px var(--shadow);
      transition: transform 0.3s ease;
      background: rgba(248, 249, 250, 0.5);
    }
    
    .preview-item:hover {
      transform: scale(1.05);
    }
    
    .preview-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    
    .preview-item .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    
    .preview-item .remove-btn:hover {
      background: rgba(255, 0, 0, 1);
    }
    
    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }
    
    .btn {
      flex: 1;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
      color: white;
    }
    
    .btn-secondary:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--primary);
      font-weight: 600;
    }
    
    .spinner {
      border: 4px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    .results-list {
      max-height: 600px;
      overflow-y: auto;
    }
    
    .result-card {
      background: rgba(253, 251, 251, 0.3);
      backdrop-filter: blur(3px);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 5px solid var(--accent);
      box-shadow: 0 4px 12px var(--shadow);
      transition: all 0.3s ease;
      animation: slideIn 0.5s ease;
    }
    
    .result-card:hover {
      transform: translateX(5px);
      box-shadow: 0 6px 20px var(--shadow);
    }
    
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    
    .result-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    
    .result-image {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
      border: 3px solid white;
      box-shadow: 0 2px 8px var(--shadow);
    }
    
    .result-details {
      display: grid;
      gap: 8px;
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }
    
    .detail-label {
      color: var(--text-light);
      font-weight: 600;
    }
    
    .detail-value {
      color: var(--text);
      font-weight: 700;
    }
    
    .confidence-badge {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 700;
      display: inline-block;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    
    .empty-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 1;
    }
    
    .btn-clear-results {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-clear-results:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
    }
    
    .processing-indicator {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(52, 152, 219, 0.1);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-left: 10px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .action-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ELEPHANT IDENTIFICATION 🐘</h1>
  </div>

  <div class="main-container">
    <!-- Upload Section -->
    <div class="upload-section">
      <h2>📤 Upload File</h2>
      <div class="current-time" id="currentTime"></div>
      
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">➕</div>
        <div class="upload-text">Upload your picture</div>
        <input type="file" id="fileInput" multiple accept="image/*,video/*" />
      </div>
      
      <div class="preview-grid" id="previewGrid"></div>
      
      <div class="action-buttons">
        <button class="btn btn-primary" id="predictBtn" disabled>
          🔍 Predict
        </button>
        <button class="btn btn-secondary" id="clearBtn">
          🗑️ Clear All
        </button>
      </div>
    </div>

    <!-- Results Section -->
    <div class="results-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">📊 Prediction</h2>
        <button class="btn-clear-results" id="clearResultsBtn" style="display: none;">
          🗑️ Clear Results
        </button>
      </div>
      <div id="resultsContainer">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <p>Empty Prediction</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/run-main";
    
    // State
    let uploadedFiles = [];
    let allResults = [];
    
    // Elements
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const predictBtn = document.getElementById('predictBtn');
    const clearBtn = document.getElementById('clearBtn');
    const clearResultsBtn = document.getElementById('clearResultsBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const currentTimeEl = document.getElementById('currentTime');
    
    // Time display
    function updateTime() {
      const now = new Date();
      const formatted = now.toLocaleString('th-TH', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      currentTimeEl.textContent = `Current Time: ${formatted}`;
    }
    updateTime();
    setInterval(updateTime, 1000);
    
    // Upload area events
    uploadArea.addEventListener('click', () => fileInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    
    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });
    
    // Handle files
    function handleFiles(files) {
      const validFiles = Array.from(files).filter(file => 
        file.type.startsWith('image/') || file.type.startsWith('video/')
      );
      
      validFiles.forEach(file => {
        if (!uploadedFiles.find(f => f.name === file.name && f.size === file.size)) {
          uploadedFiles.push(file);
          addPreview(file);
        }
      });
      
      updateUI();
    }
    
    // Add preview
    function addPreview(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.dataset.filename = file.name;
        
        const img = document.createElement('img');
        img.src = e.target.result;
        
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.innerHTML = '×';
        removeBtn.onclick = () => removeFile(file);
        
        div.appendChild(img);
        div.appendChild(removeBtn);
        previewGrid.appendChild(div);
      };
      reader.readAsDataURL(file);
    }
    
    // Remove file
    function removeFile(file) {
      uploadedFiles = uploadedFiles.filter(f => f !== file);
      const preview = previewGrid.querySelector(`[data-filename="${file.name}"]`);
      if (preview) preview.remove();
      updateUI();
    }
    
    // Clear all
    clearBtn.addEventListener('click', () => {
      uploadedFiles = [];
      previewGrid.innerHTML = '';
      updateUI();
    });
    
    // Clear results
    clearResultsBtn.addEventListener('click', () => {
      if (confirm('Clear All Predictions?')) {
        allResults = [];
        clearResultsBtn.style.display = 'none';
        resultsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <p>Empty Prediction</p>
          </div>
        `;
      }
    });
    
    // Update UI
    function updateUI() {
      predictBtn.disabled = uploadedFiles.length === 0;
    }
    
    // Predict
    predictBtn.addEventListener('click', async () => {
      if (uploadedFiles.length === 0) return;
      
      predictBtn.disabled = true;
      const totalFiles = uploadedFiles.length;
      let processedCount = 0;
      
      // Show initial loading
      showLoading(`Predicting... (0/${totalFiles})`);
      
      for (const file of uploadedFiles) {
        try {
          const startTime = new Date();
          const startTimeStr = formatDateTime(startTime);
          
          let fileToSend = file;
          
          // Extract frame from video if needed
          if (file.type.startsWith('video/')) {
            showLoading(`กำลังแยกเฟรมจากวิดีโอ... (${processedCount}/${totalFiles})`);
            fileToSend = await extractVideoFrame(file);
          }
          
          // Update loading message
          processedCount++;
          showLoading(`Predicting... (${processedCount}/${totalFiles})`);
          
          const formData = new FormData();
          formData.append('file', fileToSend);
          
          const response = await fetch(API_URL, {
            method: 'POST',
            body: formData
          });
          
          if (!response.ok) throw new Error('API Error');
          
          const data = await response.json();
          const endTime = new Date();
          const endTimeStr = formatDateTime(endTime);
          const elapsed = ((endTime - startTime) / 1000).toFixed(3);
          
          // Store result
          const result = {
            filename: file.name,
            thumbnail: URL.createObjectURL(file),
            detections: data.detections || [],
            startTime: startTimeStr,
            endTime: endTimeStr,
            elapsed: elapsed,
            timestamp: new Date()
          };
          
          allResults.unshift(result); // Add to beginning
          
          // Update results in real-time
          renderResults();
          
        } catch (error) {
          console.error('Error processing:', file.name, error);
          // Add error result
          allResults.unshift({
            filename: file.name,
            thumbnail: URL.createObjectURL(file),
            detections: [],
            error: true,
            timestamp: new Date()
          });
          renderResults();
        }
      }
      
      predictBtn.disabled = false;
      renderResults();
      
      // Show completion message
      setTimeout(() => {
        resultsContainer.scrollTop = 0;
      }, 100);
    });
    
    // Show loading
    function showLoading(message = 'Predicting...') {
      resultsContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>${message}</p>
        </div>
      `;
    }
    
    // Render results
    function renderResults() {
      if (allResults.length === 0) {
        resultsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <p>Empty Prediction</p>
          </div>
        `;
        clearResultsBtn.style.display = 'none';
        return;
      }
      
      // Show clear button
      clearResultsBtn.style.display = 'block';
      
      resultsContainer.innerHTML = `<div class="results-list"></div>`;
      const resultsList = resultsContainer.querySelector('.results-list');
      
      allResults.forEach((result, index) => {
        // Handle error results
        if (result.error) {
          const errorCard = document.createElement('div');
          errorCard.className = 'result-card';
          errorCard.style.borderLeftColor = '#e74c3c';
          errorCard.innerHTML = `
            <div class="result-header">
              <div class="result-title" style="color: #e74c3c;">❌ เกิดข้อผิดพลาด</div>
              <img src="${result.thumbnail}" class="result-image" alt="thumbnail">
            </div>
            <div class="result-details">
              <div class="detail-row">
                <span class="detail-label">File Name:</span>
                <span class="detail-value">${result.filename}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span class="detail-value" style="color: #e74c3c;">Unable to Analyze</span>
              </div>
            </div>
          `;
          resultsList.appendChild(errorCard);
          return;
        }
        
        // Handle results with no detections
        if (result.detections.length === 0) {
          const noDetCard = document.createElement('div');
          noDetCard.className = 'result-card';
          noDetCard.style.borderLeftColor = '#f39c12';
          noDetCard.innerHTML = `
            <div class="result-header">
              <div class="result-title" style="color: #f39c12;">⚠️ No Detections</div>
              <img src="${result.thumbnail}" class="result-image" alt="thumbnail">
            </div>
            <div class="result-details">
              <div class="detail-row">
                <span class="detail-label">File Name:</span>
                <span class="detail-value">${result.filename}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Result:</span>
                <span class="detail-value">No elephant found in the image</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Time Taken:</span>
                <span class="detail-value">${result.elapsed} seconds</span>
              </div>
            </div>
          `;
          resultsList.appendChild(noDetCard);
          return;
        }
        
        // Normal detection results
        result.detections.forEach((det, detIndex) => {
          const card = document.createElement('div');
          card.className = 'result-card';
          
          const identity = det.identity || 'Unknown';
          const confidence = ((det.similarity || det.confidence || 0) * 100).toFixed(3);
          
          card.innerHTML = `
            <div class="result-header">
              <div class="result-title">🐘 ${identity}</div>
              <img src="${result.thumbnail}" class="result-image" alt="thumbnail">
            </div>
            <div class="result-details">
              <div class="detail-row">
                <span class="detail-label">File Name:</span>
                <span class="detail-value">${result.filename}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Confidence:</span>
                <span class="confidence-badge">${confidence}%</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Start Time:</span>
                <span class="detail-value">${result.startTime}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">End Time:</span>
                <span class="detail-value">${result.endTime}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Time Taken:</span>
                <span class="detail-value">${result.elapsed} seconds</span>
              </div>
            </div>
          `;
          
          resultsList.appendChild(card);
        });
      });
    }
    
    // Format date time
    function formatDateTime(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      const ms = String(date.getMilliseconds()).padStart(3, '0');
      return `${d}/${m}/${y} ${h}:${min}:${s}.${ms}`;
    }
    
    // Extract video frame
    function extractVideoFrame(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.src = URL.createObjectURL(file);
        
        video.onloadeddata = () => {
          video.currentTime = Math.min(video.duration / 2, video.duration || 0);
        };
        
        video.onseeked = () => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0);
          
          canvas.toBlob((blob) => {
            if (!blob) return reject(new Error('Failed to extract frame'));
            resolve(new File([blob], 'frame.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.9);
        };
        
        video.onerror = () => reject(new Error('Cannot load video'));
      });
    }
  </script>
</body>
</html>
