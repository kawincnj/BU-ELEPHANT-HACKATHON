<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ระบบระบุตัวตนช้าง (Elephant Identification)</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* Minimal fallback if styles.css isn't loaded */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-image: url("elephant.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-color: var(--bg1);
      }
      header {
        text-align: center;
        padding: 20px;
        color: #fff;
        background: linear-gradient(
          90deg,
          rgba(255, 140, 0, 0.7),
          rgba(139, 0, 0, 0.7)
        );
      }
      .container {
        max-width: 560px;
        margin: 30px auto;
        background: #ffffffcc;
        padding: 24px;
        border-radius: 16px;
      }
      .selection-area {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 16px 0;
      }
      .selection-area button.active {
        background: #3498db;
        color: #fff;
      }
      #imagePreview {
        display: none;
        max-width: 100%;
        max-height: 380px;
        margin-top: 12px;
        border-radius: 8px;
      }
      #predictButton {
        margin-top: 16px;
        padding: 12px 24px;
        border-radius: 8px;
        background: #2ecc71;
        color: white;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ELEPHANT IDENTIFICATION 🐘</h1>
    </header>

    <div class="container">
      <h1>Upload your Elephant file</h1>
      <p>
        Please select the file type first, then upload your image or video file.
      </p>

      <div class="selection-area">
        <button id="selectImage">Upload Image 🖼️</button>
        <button id="selectVideo">Upload Video 🎥</button>
      </div>

      <hr />

      <div class="upload-area" id="mainUploadArea">
        <p id="uploadTypeText" style="font-weight: bold">Choose File..</p>
        <input type="file" id="fileUploader" accept="" />
        <p style="font-size: 12px; color: #666">
          Only selected files are supported.
        </p>
      </div>

      <div style="position: relative">
        <img id="imagePreview" src="#" alt="Uploaded Image Preview" />
        <!-- canvas overlay is injected here dynamically -->
      </div>

      <div id="statusRow" style="display: none; margin-top: 12px">
        <span id="statusText">Processing...</span>
      </div>

      <div
        id="resultsCard"
        style="display: none; margin-top: 14px; text-align: left"
      >
        <div style="font-weight: 600; margin-bottom: 6px">
          ผลการระบุ (Predictions)
        </div>
        <ol id="resultsList" style="margin: 0; padding-left: 20px"></ol>
      </div>

      <button id="predictButton">Predict</button>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
