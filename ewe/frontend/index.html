<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Elephant Identification</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Light theme using provided palette */
    :root { color-scheme: light; }
    body {
      background: #F1F7ED; /* Background */
      font-family: Arial, sans-serif;
      margin: 0;
      color: #1D1A1B; /* Text */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 20px;
      color: #1D1A1B; /* Text over gradient */
      background: linear-gradient(90deg, #80A4ED 0%, #FFA552 100%); /* Accent -> Primary */
      border-bottom: 1px solid #dfe8d9; /* soft edge on light bg */
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: #ffffff; /* light card */
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e5efe0; /* subtle border on light */
      box-shadow: 0 6px 18px rgba(29,26,27,0.08);
    }
    .selection-area { display:flex; gap:12px; justify-content:center; margin:42px 0 16px 0; }
    .selection-area button.active { background:#80A4ED; color:#1D1A1B }

    /* Preview image */
    #imagePreview {
      display:none;
      max-width:100%;
      max-height:380px;
      margin-top:12px;
      border-radius:8px;
      border: 1px solid #e5efe0;
    }

    #predictButton { margin-top:16px; padding:12px 24px; border-radius:8px; background:#FFA552; color:#1D1A1B; border:none; font-weight:700; cursor:pointer }

    hr { border:0; border-top:1px solid #e5efe0; }

    /* Buttons */
    .btn {
      padding:10px 16px;
      border-radius:8px;
      border:1px solid #80A4ED; /* Accent border */
      cursor:pointer;
      font-weight:600;
      background:#ffffff;
      color:#1D1A1B;
    }
    .btn.primary { background:#80A4ED; color:#1D1A1B; border-color:#80A4ED }
    .btn.success { background:#FFA552; color:#1D1A1B; border-color:#FFA552 }
    .btn:hover { filter: brightness(0.98); }

    /* Make the Open Uploader button larger */
    #openModalBtn {
      padding: 16px 32px;
      font-size: 1.125rem; /* ~18px */
      border-radius: 12px;
    }

    /* Modal styles */
    .modal {
      display:none; position:fixed; inset:0; background:rgba(29,26,27,0.45); z-index:1000; align-items:center; justify-content:center;
    }
    .modal-content {
      width:90%; max-width:520px; background:#ffffff; color:#1D1A1B; border:1px solid #e5efe0; border-radius:12px; padding:20px; box-shadow:0 10px 30px rgba(29,26,27,0.15);
    }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .modal-close { background:transparent; border:none; font-size:20px; cursor:pointer; line-height:1; color:#1D1A1B }

    .field { margin:10px 0; }
    .field label { display:block; font-weight:600; margin-bottom:6px; color:#1D1A1B }
    .field select, .field input[type="file"] {
      width:96%; background:#ffffff; color:#1D1A1B; border:1px solid rgba(128,164,237,0.6); border-radius:6px; padding:8px;
    }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }

    /* Center the first heading in the container */
    .container > h1:first-of-type { text-align: center; }

    /* Center the preview image and overlay together */
    .preview-center { text-align: center; }
    .preview-box { position: relative; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1>🐘ELEPHANT IDENTIFICATION WEBSITE🐘</h1>
  </header>

  <div class="container">
    <h1>Please upload your elephant file.</h1>

    <!-- no more upload -->
    <div class="upload-area field" id="mainUploadArea" style="margin-top:24px;">
      <p id="uploadTypeText" style="font-weight:bold;">Please select your file</p>
      <input type="file" id="fileUploader" accept="image/*,video/*" />
      <p style="font-size:12px;color:#6b6f6a;">Supports images and videos. (Only 🐘🐘🐘 please)</p>
      <div class="modal-actions">
        <button id="predictButton" class="btn success">Predict</button>
      </div>
    </div>

    <hr />

    <!-- Centered preview wrapper -->
    <div class="preview-center">
      <div class="preview-box">
        <img id="imagePreview" src="#" alt="Image Preview" />
        <!-- canvas overlay is injected here dynamically -->
      </div>
    </div>

    <div id="statusRow" style="display:none;margin-top:12px;">
      <span id="statusText">Predicting...</span>
    </div>

    <div id="resultsCard" style="display:none;margin-top:14px;text-align:left;">
      <div style="font-weight:600;margin-bottom:6px;">Predictions</div>
      <ol id="resultsList" style="margin:0;padding-left:20px;"></ol>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
