<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบระบุตัวตนช้าง (Elephant Identification)</title>
    
    <style>
        /* ------------------------------------------------------------------ */
        /* 1. GLOBAL STYLES & BACKGROUND */
        /* ------------------------------------------------------------------ */
        body {
            font-family: 'Poppins', 'Arial', sans-serif; 
            color: #2c3e50; 
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            
            /* Background: ใช้ไฟล์ ele.png ตามที่คุณต้องการ */
            background-image: url('ele.png'); 
            background-size: cover; 
            background-position: center center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            background-color: #2980b9; 
        }

        /* ------------------------------------------------------------------ */
        /* 2. HEADER: ใช้ Gradient โทนทอง-แดง และปรับให้จางลง (70% Opacity) */
        /* ------------------------------------------------------------------ */
        header {
            /* **แก้ไขตรงนี้:** ปรับความโปร่งใสลงเป็น 70% (0.7) */
            background: linear-gradient(90deg, rgba(255, 140, 0, 0.7), rgba(139, 0, 0, 0.7)); 
            color: #ffffff;
            padding: 20px 0;
            margin-bottom: 40px;
            border-radius: 0 0 15px 15px; 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4); 
            position: relative; 
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1.5px; 
        }
        
        /* ------------------------------------------------------------------ */
        /* 3. CONTAINER (The Main Card): โปร่งใส 75% */
        /* ------------------------------------------------------------------ */
        .container {
            background-color: rgba(255, 255, 255, 0.75); /* โปร่งใส 75% */
            padding: 40px;
            margin: 40px auto; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), 
                        0 0 0 8px rgba(255, 255, 255, 0.6); 
            max-width: 550px; 
            width: 90%;
            transition: transform 0.3s ease-in-out;
        }
        
        .container:hover {
            transform: translateY(-5px); 
        }

        .container h1 {
            color: #34495e; 
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .container p {
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        
        hr {
            border: 0;
            height: 1px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0));
            margin: 30px 0;
        }
        
        /* ------------------------------------------------------------------ */
        /* 4. BUTTONS & INPUTS */
        /* ------------------------------------------------------------------ */
        .selection-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .selection-area button {
            background-color: #ecf0f1; 
            color: #3498db; 
            padding: 12px 25px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            flex-grow: 1; 
            max-width: 200px;
        }

        .selection-area button:hover {
            background-color: #3498db; 
            color: white;
            border-color: #3498db;
        }
        
        .selection-area button.active {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.4);
        }
        
        .upload-area {
            border: 2px dashed #95a5a6; 
            padding: 30px;
            margin-top: 30px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.9); 
        }
        
        /* ปุ่ม Continue */
        #continueButton {
            background-color: #2ecc71 !important; 
            color: white !important;
            padding: 15px 35px !important;
            border: none !important;
            border-radius: 10px !important;
            margin-top: 35px !important;
            cursor: pointer;
            font-size: 20px !important;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.5);
        }
        
        #continueButton:hover {
            background-color: #27ae60 !important;
            transform: translateY(-2px);
        }
        
        #imagePreview {
            display: none;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-top: 20px;
            border: 5px solid #bdc3c7; 
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ELEPHANT IDENTIFICATION 🐘</h1>
    </header>
    
    <div class="container">
        <h1>Upload your Elephant file</h1>
        <p>Please select the file type first, then upload your image or video file.</p>

        <div class="selection-area">
            <button id="selectImage">Upload Image 🖼️</button>
            <button id="selectVideo">Upload Video 🎥</button>
        </div>
        
        <hr>
        
        <div class="upload-area" id="mainUploadArea">
            <p id="uploadTypeText" style="font-weight: bold;">กรุณาเลือกไฟล์...</p>
            
            <input 
                type="file" 
                id="fileUploader" 
                accept="" 
            >
            
            <p style="font-size: small; color: #95a5a6;">รองรับไฟล์ที่เลือกไว้เท่านั้น</p>
        </div>
        
        <img id="imagePreview" src="#" alt="ตัวอย่างรูปภาพที่อัปโหลด">
        
        <button id="continueButton">
            Continue
        </button>
    </div>

    <script>
        const selectImageButton = document.getElementById('selectImage');
        const selectVideoButton = document.getElementById('selectVideo');
        const mainUploadArea = document.getElementById('mainUploadArea');
        const fileUploader = document.getElementById('fileUploader');
        const uploadTypeText = document.getElementById('uploadTypeText');
        const imagePreview = document.getElementById('imagePreview');
        const continueButton = document.getElementById('continueButton'); 
        
        let currentFileType = null; 

        function setFileType(type) {
            currentFileType = type;
            mainUploadArea.style.display = 'block'; 
            imagePreview.style.display = 'none';    
            fileUploader.value = '';                

            if (type === 'image') {
                selectImageButton.classList.add('active');
                selectVideoButton.classList.remove('active');
                uploadTypeText.textContent = 'เลือกไฟล์รูปภาพ (Image)';
                fileUploader.setAttribute('accept', 'image/*');
            } else if (type === 'video') {
                selectImageButton.classList.remove('active');
                selectVideoButton.classList.add('active');
                uploadTypeText.textContent = 'เลือกไฟล์วิดีโอ (Video)';
                fileUploader.setAttribute('accept', 'video/*');
            }
        }

        selectImageButton.addEventListener('click', () => setFileType('image'));
        selectVideoButton.addEventListener('click', () => setFileType('video'));

        fileUploader.addEventListener('change', function(event) {
            const file = event.target.files[0];
            
            if (file && currentFileType === 'image') {
                const reader = new FileReader(); 
                reader.onload = function(e) {
                    imagePreview.src = e.target.result; 
                    imagePreview.style.display = 'block'; 
                };
                reader.readAsDataURL(file);
            } else {
                imagePreview.src = '#';
                imagePreview.style.display = 'none';
            }
        });

        continueButton.addEventListener('click', function() {
            if (!currentFileType) {
                alert('กรุณาเลือกประเภทไฟล์ก่อน (Image หรือ Video)!');
                return;
            }
            
            if (fileUploader.files.length === 0) {
                alert('กรุณาเลือกไฟล์ก่อนกด Continue!');
                return;
            }
            
            console.log(`File selected: ${fileUploader.files[0].name}, Type: ${currentFileType}`);
            window.location.href = 'output.html';
        });
    </script>
</body>
</html>
